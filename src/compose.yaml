networks:
  42nice:
    driver: bridge
  db_network:
    driver: bridge

volumes:
  postgres_data:
  static_files:
  media_files:

services:
  ## INTERFACE ##
  nginx:
    build: requirements/nginx
    container_name: "nginx"
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost/api/content/"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      django:
        condition: service_healthy
    restart: no
    volumes:
      - static_files:/static
    networks:
      - 42nice
    ports:
      - "8080:443"

  ## BACKEND ##
  django:
    build: requirements/django
    container_name: "django"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/content/"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgresql:
        condition: service_healthy
    restart: no
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_DB_NAME=${DJANGO_DB_NAME}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DJANGO_MEDIA_ROOT=/media
      - FRONTEND_URL=${FRONTEND_URL}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - FT_CLIENT_ID=${FT_CLIENT_ID}
      - FT_CLIENT_SECRET=${FT_CLIENT_SECRET}
    volumes:
      - static_files:/static
      # Les avatars doivent survivre au redémarrage du conteneur.
      - media_files:/media
    networks:
      - 42nice
      - db_network

  postgresql:
    build: requirements/postgresql
    container_name: "postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 42"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: no
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network

  # Jeu et chat réunis : les hébergeurs gratuits ne donnent qu'un service, et
  # deux namespaces socket.io suffisent à les séparer.
  realtime:
    build: requirements/realtime
    container_name: "realtime"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - WIN_SCORE=${WIN_SCORE}
      # Même clé que Django : le service vérifie lui-même la signature des JWT
      # au lieu de croire l'identité annoncée par le client.
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_API_URL=http://django:8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - 42nice
