user root;

# Nombre de workers calé sur le nombre de cœurs.
worker_processes auto;

# JIT des expressions régulières.
pcre_jit on;

error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules/*.conf;
include /etc/nginx/conf.d/*.conf;

events {
	worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        server_name ft_transcendence.com;

		ssl_certificate /etc/nginx/ssl_certificates/nginx.crt;
		ssl_certificate_key /etc/nginx/ssl_certificates/nginx.key;

        # Le frontend n'est plus servi ici : en développement c'est Vite qui le
		# sert et qui proxifie /api et /socket.io vers ce nginx, et en production
		# c'est un hébergeur statique. Ne restent que l'API, l'admin, les avatars
		# et le temps réel.
		location ~ ^/(api|admin) {
			proxy_pass http://django:8000;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Assets de l'admin Django, déposés par collectstatic.
		location /static {
			alias /static;
		}

		# Avatars envoyés par les utilisateurs, écrits par Django sur le volume
		# partagé. Servis ici pour que le processus applicatif ne lise aucun
		# fichier uploadé.
		location /media {
			alias /media;
		}

		# Un seul service temps réel, deux namespaces socket.io (/game et /chat)
		# sur le chemin par défaut.
		location /socket.io/ {
			proxy_pass http://realtime:3000/socket.io/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
		}

	}

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.3;

	# Doit rester au-dessus de la limite d'avatar appliquée par Django (2 Mo),
	# sinon nginx renvoie 413 avant que la vue ne puisse répondre.
	client_max_body_size 4m;

	# Variable d'aide pour le proxy websocket.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
			'$status $body_bytes_sent "$http_referer" '
			'"$http_user_agent" "$http_x_forwarded_for"';

	access_log /var/log/nginx/access.log main;
}
